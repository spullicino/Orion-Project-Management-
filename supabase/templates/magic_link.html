<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your sign-in link</title>
</head>
<body style="margin:0;padding:0;background:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:32px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e2e8f0;">
        <tr><td style="background:#1e3a8a;padding:20px 28px;">
          <img src="{{ .SiteURL }}/brand/orion-mark.png" width="40" height="40" alt="Orion" style="vertical-align:middle;border-radius:10px;">
          <span style="color:#ffffff;font-size:18px;font-weight:700;vertical-align:middle;margin-left:10px;">Orion Projects</span>
        </td></tr>
        <tr><td style="padding:28px;">
          <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;">Your sign-in link</h1>
          <p style="margin:0 0 24px;font-size:16px;line-height:1.6;color:#334155;">Tap the button below to sign in to Orion Projects. The link works once.</p>
          <table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="border-radius:10px;background:#1d4ed8;">
            <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink&next=/home" style="display:inline-block;padding:14px 26px;font-size:16px;font-weight:600;color:#ffffff;text-decoration:none;border-radius:10px;">Sign in</a>
          </td></tr></table>
          <p style="margin:24px 0 0;font-size:13px;line-height:1.6;color:#64748b;">If you didn&rsquo;t ask for this, you can ignore this email.</p>
        </td></tr>
        <tr><td style="padding:16px 28px;border-top:1px solid #e2e8f0;font-size:12px;color:#94a3b8;">
          Orion Group &middot; This is an automated message from Orion Projects. Please don&rsquo;t reply.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
